<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>

  <meta http-equiv="Content-Style-Type" content="text/css">
  <title>Contact - Wren's Widgets</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" type="image/png" href="../favicon.png">
</head>
<body>
<header class="header-bar">
  <div class="site-banner">This site is under construction — but you're welcome to snoop :p</div>
  <img src="../resources/logos/couple_brownText_noBackground.png" alt="logo" class="header-logo">
  <h1>R &nbsp; E &nbsp; E &nbsp; N &nbsp; A &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; P &nbsp; E &nbsp; T &nbsp; R &nbsp; I &nbsp; C &nbsp; K</h1>
  <nav class="nav-bar">
    <ul>

      <li><a href="../blog/">blog</a></li>
      <li><a href="./">contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="form-container">
    <!-- Using FormSubmit.co to send email without a server.
         To change the recipient, update the action URL below. -->
    <form action="https://formsubmit.co/452ee81060288eeddb4496a7e412b337" method="POST">
      <input type="hidden" name="_subject" value="New message from wrens.widgets contact form">
      <input type="hidden" name="_captcha" value="false">
      <p class="p3"><label>Name<br><input type="text" name="name" required></label></p>
      <p class="p3"><label>Email<br><input type="email" name="email" required></label></p>
      <p class="p3"><label>Message<br><textarea name="message" rows="6" required></textarea></label></p>
      <p class="p3"><input type="submit" value="Send"></p>
    </form>
  </div>
</main>

<footer class="site-footer">
  <a href="https://github.com/reenapetrick">Github</a> &nbsp;|&nbsp; <a href="https://www.instagram.com/wrens.widgets/">Instagram</a>
</footer>
</body>
</html>
